name: 데이터 자동 갱신 (12시간 주기)

on:
  # 12시간마다 자동 실행 (UTC 기준 0, 12시 → KST 9시, 21시)
  # 서버 트래픽 절감을 위해 6시간→12시간으로 조정
  schedule:
    - cron: '0 0,12 * * *'

  # 수동 실행 (GitHub Actions 탭에서 "Run workflow" 클릭)
  workflow_dispatch:
    inputs:
      skip_products:
        description: '제품 크롤러 건너뛰기'
        required: false
        default: 'false'
        type: boolean
      skip_cafe:
        description: '카페 크롤러 건너뛰기'
        required: false
        default: 'false'
        type: boolean

# 동시 실행 방지 (이전 실행이 완료될 때까지 대기)
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  crawl-and-update:
    name: 크롤링 및 데이터 갱신
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write   # 커밋 + 푸시 권한

    steps:
      # ─── 1. 코드 체크아웃 ────────────────────────────────────
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # ─── 2. Python 설치 ──────────────────────────────────────
      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'crawler/requirements.txt'

      # ─── 3. 의존성 설치 ──────────────────────────────────────
      - name: Python 의존성 설치
        run: |
          pip install --upgrade pip
          pip install -r crawler/requirements.txt

      # ─── 4. Chrome 설치 (Selenium용) ──────────────────────────
      - name: Chrome 브라우저 설치
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: 'stable'

      # ─── 5. 제품 크롤러 실행 ────────────────────────────────
      - name: 영재컴퓨터 제품 데이터 크롤링
        id: crawl_products
        if: ${{ github.event.inputs.skip_products != 'true' }}
        working-directory: crawler
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          echo "===== 제품 크롤러 시작 ====="
          python crawl_products.py
          echo "===== 제품 크롤러 완료 ====="
        continue-on-error: true  # 실패해도 이전 데이터 유지

      # ─── 5-1. 제품 크롤러 실패 기록 ───────────────────────────
      - name: 제품 크롤러 실패 감지
        if: steps.crawl_products.outcome == 'failure'
        run: |
          echo "crawl_failed=true" >> $GITHUB_ENV
          echo "⚠️ 제품 크롤러가 실패했습니다. 이전 데이터를 유지합니다."

      # ─── 6. 카페 출고사진 크롤러 실행 ───────────────────────
      - name: 네이버 카페 출고사진 크롤링
        id: crawl_cafe
        if: ${{ github.event.inputs.skip_cafe != 'true' }}
        working-directory: crawler
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PW: ${{ secrets.NAVER_PW }}
          PYTHONUNBUFFERED: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          echo "===== 카페 크롤러 시작 ====="
          python crawl_cafe.py
          echo "===== 카페 크롤러 완료 ====="
        continue-on-error: true  # 실패해도 이전 데이터 유지

      # ─── 7. Node 설치 (esbuild용) ─────────────────────────────
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── 8. 단일 HTML 빌드 (배포용) ──────────────────────────
      - name: 단일 HTML 빌드
        run: |
          npm install -g esbuild
          python3 scripts/export_single_html.py
          cp vercel.json build/

      # ─── 9. 변경사항 확인 ───────────────────────────────────
      - name: 변경사항 확인
        id: check_changes
        run: |
          git diff --name-only data/
          if git diff --quiet data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "데이터 변경사항 없음"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "데이터 변경 감지됨:"
            git diff --stat data/
          fi

      # ─── 10. 데이터·빌드 커밋 & 푸시 ───────────────────────────
      - name: 데이터·빌드 커밋 및 푸시
        if: steps.check_changes.outputs.changed == 'true'
        id: push_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/pc_data.json data/cafe_posts.json build/
          TIMESTAMP=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
          git commit -m "data: 자동 갱신 - ${TIMESTAMP}"

          git push origin HEAD
          echo "pushed=true" >> $GITHUB_OUTPUT
          echo "✅ 데이터·빌드 푸시 완료: ${TIMESTAMP}"

      # ─── 11. Vercel 프로덕션 배포 (VERCEL_TOKEN 시크릿 설정 시 자동 실행) ───
      - name: Vercel 프로덕션 배포
        if: steps.push_data.outputs.pushed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN 미설정 — Vercel 배포 건너뜀"
            exit 0
          fi
          npm install -g vercel
          vercel --prod --yes --token "$VERCEL_TOKEN" --scope davesong-devs-projects
          echo "✅ Vercel 배포 완료"

      # ─── 12. 변경 없을 때 알림 ──────────────────────────────
      - name: 변경사항 없음 알림
        if: steps.check_changes.outputs.changed == 'false'
        run: |
          echo "ℹ️ 데이터 변경사항이 없습니다. 커밋 생략."

      # ─── 13. 실행 요약 ──────────────────────────────────────
      - name: 실행 결과 요약
        if: always()
        run: |
          echo "## 크롤링 실행 결과" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **실행 시간**: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')" >> $GITHUB_STEP_SUMMARY
          echo "- **트리거**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f data/pc_data.json ]; then
            PRODUCT_COUNT=$(python3 -c "import json; d=json.load(open('data/pc_data.json')); print(len(d.get('products', [])))" 2>/dev/null || echo "?")
            VALID=$(python3 -c "import json; json.load(open('data/pc_data.json')); print('✅ 정상')" 2>/dev/null || echo "❌ 손상")
            echo "- **제품 수**: ${PRODUCT_COUNT}개 (${VALID})" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f data/cafe_posts.json ]; then
            POST_COUNT=$(python3 -c "import json; d=json.load(open('data/cafe_posts.json')); print(len(d.get('posts', [])))" 2>/dev/null || echo "?")
            echo "- **카페 게시글**: ${POST_COUNT}개" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.crawl_products.outcome }}" = "failure" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **제품 크롤러 실패** — 이전 데이터 유지됨" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.crawl_cafe.outcome }}" = "failure" ]; then
            echo "⚠️ **카페 크롤러 실패** — 이전 데이터 유지됨" >> $GITHUB_STEP_SUMMARY
          fi

      # ─── 14. 워크플로우 실패 알림 ──────────────────────────────
      - name: 워크플로우 실패 알림
        if: failure()
        run: |
          echo "❌ 워크플로우 실패"
          echo "실패 시간: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')"
          echo "실패 단계는 위 로그를 확인하세요."
          echo "GitHub Actions URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
