<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>품절 관리 · 영재컴퓨터</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181c27;
      --border: #2a3142;
      --text: #e8eaef;
      --muted: #8b93a7;
      --accent: #6c9eff;
      --danger: #f87171;
      --ok: #4ade80;
      --purple: #a78bfa;
      --radius: 12px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 10% -10%, #1a2240 0%, transparent 55%), var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
    h1 { font-size: 1.35rem; font-weight: 700; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    input[type="password"] {
      width: 100%;
      max-width: 280px;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0c0e14;
      color: var(--text);
      font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; margin-top: 0.75rem; }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .btn-primary { background: linear-gradient(135deg, #4f74ff, #6c9eff); color: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-revive {
      background: rgba(74, 222, 128, 0.15);
      color: var(--ok);
      border: 1px solid rgba(74, 222, 128, 0.35);
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
    }
    .btn-revive:disabled { opacity: 0.45; cursor: not-allowed; }
    .hidden { display: none !important; }
    .msg { font-size: 0.85rem; margin-top: 0.75rem; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--ok); }
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 640px; }
    th, td {
      padding: 0.65rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { background: #12151f; color: var(--muted); font-weight: 600; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .badge { display: inline-block; padding: 0.15rem 0.45rem; border-radius: 6px; font-size: 0.72rem; font-weight: 600; }
    .badge-revived {
      background: rgba(167, 139, 250, 0.2);
      color: var(--purple);
      border: 1px solid rgba(167, 139, 250, 0.35);
    }
    .badge-soldout {
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .code-cell { display: flex; align-items: center; gap: 0.4rem; }
    .code-badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: 'Consolas', 'Menlo', monospace;
      background: rgba(108, 158, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(108, 158, 255, 0.35);
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .code-none {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .btn-copy {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.72rem;
      padding: 0.2rem 0.45rem;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn-copy:hover { background: rgba(255,255,255,0.12); color: var(--text); }
    .btn-copy.copied { color: var(--ok); border-color: rgba(74,222,128,0.4); }
    .product-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .product-link:hover { text-decoration: underline; }
    .thumb {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #12151f;
      display: block;
      flex-shrink: 0;
    }
    .thumb-broken { opacity: 0.25; }
    .name-cell { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
    .name-text { min-width: 0; }
    .name-text .pname { font-size: 0.82rem; line-height: 1.4; word-break: keep-all; }
    .name-text .stub-note { font-size: 0.72rem; color: var(--danger); margin-top: 0.15rem; }
    .badge-warn {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.35);
    }
    .badge-ok-stock {
      background: rgba(74, 222, 128, 0.1);
      color: var(--ok);
      border: 1px solid rgba(74, 222, 128, 0.25);
    }
    .badge-soldout-stock {
      background: rgba(248, 113, 113, 0.08);
      color: var(--muted);
      border: 1px solid rgba(248, 113, 113, 0.2);
    }
    tr.row-warn td { background: rgba(251, 191, 36, 0.04); }
    tr.row-warn:hover td { background: rgba(251, 191, 36, 0.08); }
    .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
    .filter-btn {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.7rem;
      font-size: 0.8rem;
      background: transparent;
      color: var(--muted);
      font-weight: 500;
    }
    .filter-btn.active { background: rgba(108,158,255,0.15); color: var(--accent); border-color: rgba(108,158,255,0.4); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>품절 · 보류 상품 관리</h1>
    <p class="sub">PIN 인증 후 목록을 확인하고 GitHub에 복원 상태를 반영합니다.</p>

    <section id="pin-panel" class="card">
      <label for="pin-input">관리자 PIN</label>
      <div class="row">
        <input id="pin-input" type="password" autocomplete="current-password" placeholder="PIN 입력" />
        <button type="button" class="btn-primary" id="btn-login">확인</button>
      </div>
      <p id="pin-msg" class="msg err hidden"></p>
    </section>

    <section id="dash-panel" class="hidden">
      <div class="toolbar">
        <span class="sub" style="margin:0" id="dash-welcome">대시보드</span>
        <div>
          <button type="button" class="btn-ghost" id="btn-refresh">새로고침</button>
          <button type="button" class="btn-ghost" id="btn-logout">로그아웃</button>
        </div>
      </div>
      <!-- 통계 패널 -->
      <div id="stats-bar" class="card" style="display:flex;flex-wrap:wrap;gap:1.5rem;padding:1rem 1.25rem;margin-bottom:0.75rem;">
        <div><div style="font-size:0.72rem;color:var(--muted)">전체 크롤링</div><div id="stat-total" style="font-size:1.4rem;font-weight:700">—</div></div>
        <div><div style="font-size:0.72rem;color:var(--ok)">판매중</div><div id="stat-active" style="font-size:1.4rem;font-weight:700;color:var(--ok)">—</div></div>
        <div><div style="font-size:0.72rem;color:var(--danger)">현재 품절</div><div id="stat-soldout" style="font-size:1.4rem;font-weight:700;color:var(--danger)">—</div></div>
        <div><div style="font-size:0.72rem;color:var(--purple)">복원 처리됨</div><div id="stat-revived" style="font-size:1.4rem;font-weight:700;color:var(--purple)">—</div></div>
        <div><div style="font-size:0.72rem;color:var(--muted)">미처리</div><div id="stat-pending" style="font-size:1.4rem;font-weight:700">—</div></div>
      </div>
      <div class="card">
        <p id="load-msg" class="msg"></p>
        <div class="filter-bar">
          <span style="font-size:0.8rem;color:var(--muted)">필터:</span>
          <button type="button" class="filter-btn active" id="filter-all">전체 품절</button>
          <button type="button" class="filter-btn" id="filter-pending">미처리</button>
          <button type="button" class="filter-btn" id="filter-revived">복원 처리됨</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>상품 링크</th>
                <th>상품명 / 썸네일</th>
                <th>상품코드</th>
                <th>가격</th>
                <th>티어</th>
                <th>처리 상태</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script>
    (function () {
    /* ====================================================
     * Admin 품절 관리 — 단순화 재설계
     * 주 목록: pc_data.in_stock=false 상품 (현재 크롤링 기준 품절)
     * 보조 상태: soldout_log.revived (복원 처리 여부)
     * GitHub API: 복원 버튼 액션에만 사용
     * ==================================================== */
      var adminPin = '';
      var pinInput = document.getElementById('pin-input');
      var btnLogin = document.getElementById('btn-login');
      var pinMsg = document.getElementById('pin-msg');
      var pinPanel = document.getElementById('pin-panel');
      var dashPanel = document.getElementById('dash-panel');
      var tbody = document.getElementById('tbody');
      var loadMsg = document.getElementById('load-msg');
      var btnRefresh = document.getElementById('btn-refresh');
      var btnLogout = document.getElementById('btn-logout');

      // ── 유틸 ──────────────────────────────────────────────────
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
      }
      function formatPrice(n) {
        var x = Number(n);
        return isFinite(x) && x > 0 ? x.toLocaleString('ko-KR') + '원' : '-';
      }
      function showPinErr(t) {
        pinMsg.textContent = t || '';
        pinMsg.classList.toggle('hidden', !t);
        pinMsg.classList.toggle('err', !!t);
      }
      async function postJson(url, body) {
        var r = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body || {}),
        });
        var data = null;
        try { data = await r.json(); } catch (e) { data = null; }
        return { ok: r.ok, status: r.status, data: data };
      }

      var SHOP_BASE = 'https://www.youngjaecomputer.com/shop';
      var THUMB_BASE = 'https://admin.youngjaecomputer.com/data/item';
      var CODE_PATTERN = /\b([A-Z]{2,3}\d{3,4}(?:_[A-Z0-9]+)?)\b/g;
      var CODE_EXCLUDE = /^(RTX|GTX|RX|CPU|GPU|RAM|SSD|HDD|DDR|USB|LCD|LED|PSU|NVMe|ATX|ITX|OC|TDP|FPS|QHD|FHD|UHD|B2B|RGB|PC|AI|VGA|SIO|DIY)$/i;

      function extractCode(name) {
        if (!name) return '';
        CODE_PATTERN.lastIndex = 0;
        var m, found = [];
        while ((m = CODE_PATTERN.exec(name)) !== null)
          if (!CODE_EXCLUDE.test(m[1])) found.push(m[1]);
        return found[0] || '';
      }
      function copyToClipboard(text, btn) {
        navigator.clipboard.writeText(text).then(function () {
          btn.textContent = '복사됨!'; btn.classList.add('copied');
          setTimeout(function () { btn.textContent = '복사'; btn.classList.remove('copied'); }, 1500);
        }).catch(function () {
          var ta = document.createElement('textarea');
          ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
          document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
          btn.textContent = '복사됨!'; btn.classList.add('copied');
          setTimeout(function () { btn.textContent = '복사'; btn.classList.remove('copied'); }, 1500);
        });
      }

      // ── 상태 ──────────────────────────────────────────────────
      var currentFilter = 'all';
      var _revivedMap = {};   // id → true (soldout_log.revived=true 목록)
      var _soldoutList = [];  // pc_data.in_stock=false 상품 배열 (주 목록)
      var _canWrite = false;  // GitHub API 사용 가능 여부

      // ── 통계 패널 ──────────────────────────────────────────────
      function updateStats(total, inStock, soldoutCount, revivedCount) {
        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-active').textContent = inStock;
        document.getElementById('stat-soldout').textContent = soldoutCount;
        document.getElementById('stat-revived').textContent = revivedCount;
        document.getElementById('stat-pending').textContent = soldoutCount - revivedCount;
      }

      // ── 테이블 렌더 ───────────────────────────────────────────
      function renderRows(soldoutProducts, revivedMap, preserveMsg) {
        tbody.innerHTML = '';
        if (!soldoutProducts.length) {
          if (!preserveMsg) { loadMsg.textContent = '현재 크롤링 기준 품절 상품이 없습니다.'; loadMsg.className = 'msg ok'; }
          return;
        }
        if (!preserveMsg) {
          var pending = soldoutProducts.filter(function (p) { return !revivedMap[String(p.id)]; }).length;
          loadMsg.textContent = '품절 ' + soldoutProducts.length + '개 · 미처리 ' + pending + '개';
          loadMsg.className = pending ? 'msg' : 'msg ok';
        }

        soldoutProducts.forEach(function (p) {
          var id = String(p.id != null ? p.id : '');
          var revived = !!revivedMap[id];
          var purl = SHOP_BASE + '/item.php?it_id=' + encodeURIComponent(id);
          var turl = THUMB_BASE + '/' + encodeURIComponent(id) + '_m';
          var name = (p.name && p.name !== '상품 ' + id) ? p.name : '';
          var displayName = name ? esc(name) : '<span style="color:var(--muted);font-size:0.78rem">(이름 미수집)</span>';
          var tier = (p.categories && p.categories.tier) || p.tier || '';
          var price = p.price || 0;
          var productCode = extractCode(name);

          var statusHtml = revived
            ? '<span class="badge badge-revived">복원 처리됨</span><br><span style="font-size:0.7rem;color:var(--muted)">다음 크롤에서 반영</span>'
            : '<span class="badge badge-soldout">미처리</span>';

          var tr = document.createElement('tr');
          tr.dataset.filter = revived ? 'revived' : 'pending';

          var codeCell = productCode
            ? '<div class="code-cell"><span class="code-badge">' + esc(productCode) + '</span><button type="button" class="btn-copy" data-code="' + esc(productCode) + '">복사</button></div>'
            : '<span class="code-none">-</span>';

          tr.innerHTML =
            '<td><a class="product-link" href="' + esc(purl) + '" target="_blank" rel="noopener">it_id: ' + esc(id) +
              '<br><span style="font-size:0.7rem;opacity:0.6">↗ 상품 페이지 열기</span></a></td>' +
            '<td><div class="name-cell">' +
              '<img class="thumb" src="' + esc(turl) + '" alt="" loading="lazy" onerror="this.classList.add(\'thumb-broken\');this.src=\'\';" />' +
              '<div class="name-text"><div class="pname">' + displayName + '</div></div></div></td>' +
            '<td>' + codeCell + '</td>' +
            '<td class="price">' + esc(formatPrice(price)) + '</td>' +
            '<td>' + esc(tier) + '</td>' +
            '<td>' + statusHtml + '</td>' +
            '<td></td>';

          var copyBtn = tr.querySelector('.btn-copy');
          if (copyBtn) copyBtn.addEventListener('click', function () { copyToClipboard(this.dataset.code, this); });

          var tdBtn = tr.querySelector('td:last-child');
          var btn = document.createElement('button');
          btn.type = 'button'; btn.className = 'btn-revive';
          btn.textContent = revived ? '복원됨' : '복원';
          btn.disabled = revived;
          btn.addEventListener('click', (function (pid, b) {
            return function () { reviveProduct(pid, b); };
          })(id, btn));
          tdBtn.appendChild(btn);
          tbody.appendChild(tr);
        });

        applyFilter(currentFilter);
      }

      function applyFilter(f) {
        currentFilter = f;
        document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
        var ab = document.getElementById('filter-' + f);
        if (ab) ab.classList.add('active');
        tbody.querySelectorAll('tr').forEach(function (tr) {
          var show = (f === 'all') || (f === 'pending' && tr.dataset.filter === 'pending') || (f === 'revived' && tr.dataset.filter === 'revived');
          tr.style.display = show ? '' : 'none';
        });
      }

      // ── 데이터 로딩 ───────────────────────────────────────────
      // 주 목록: 정적 /data/pc_data.json (항상 가능)
      // 복원 상태: 정적 /data/soldout_log.json
      // GitHub API는 복원 액션에만 사용
      async function loadLog() {
        loadMsg.textContent = '불러오는 중…';
        loadMsg.className = 'msg';
        btnRefresh.disabled = true; btnRefresh.textContent = '새로고침 중…';
        try {
          // 1) pc_data.json — 품절 목록의 주 소스
          var pcResp = await fetch('/data/pc_data.json?t=' + Date.now(), { cache: 'no-store' });
          if (!pcResp.ok) throw new Error('pc_data.json ' + pcResp.status);
          var pcData = await pcResp.json();
          var products = pcData.products || [];
          _soldoutList = products.filter(function (p) { return p.in_stock !== true; });

          // 2) soldout_log.json — 복원 상태 보조 소스
          _revivedMap = {};
          try {
            var logResp = await fetch('/data/soldout_log.json?t=' + Date.now(), { cache: 'no-store' });
            if (logResp.ok) {
              var logData = await logResp.json();
              (logData.soldout || []).forEach(function (e) {
                if (e.revived === true) _revivedMap[String(e.id)] = true;
              });
            }
          } catch (_) {}

          // 3) GitHub API 사용 가능 여부 탐색 (복원 버튼 활성화 여부)
          _canWrite = false;
          try {
            var probe = await postJson('/api/admin-soldout-log', { adminPin: adminPin });
            _canWrite = !!(probe.ok && probe.data && probe.data.log);
            // GitHub에서 더 최신 revived 상태 가져오기
            if (_canWrite && probe.data.log) {
              _revivedMap = {};
              (probe.data.log.soldout || []).forEach(function (e) {
                if (e.revived === true) _revivedMap[String(e.id)] = true;
              });
            }
          } catch (_) {}

          var total = products.length;
          var inStock = products.filter(function (p) { return p.in_stock === true; }).length;
          var revivedCount = _soldoutList.filter(function (p) { return _revivedMap[String(p.id)]; }).length;
          updateStats(total, inStock, _soldoutList.length, revivedCount);

          var now = new Date().toLocaleString('ko-KR');
          document.getElementById('dash-welcome').textContent = '마지막 갱신: ' + now + (_canWrite ? '' : ' · ⚠ 읽기 전용');
          renderRows(_soldoutList, _revivedMap, false);
        } catch (e) {
          loadMsg.textContent = '데이터 로드 실패: ' + (e.message || e);
          loadMsg.className = 'msg err';
        } finally {
          btnRefresh.disabled = false; btnRefresh.textContent = '새로고침';
        }
      }

      // ── 복원 액션 ─────────────────────────────────────────────
      async function reviveProduct(productId, btn) {
        if (!adminPin || !productId) return;
        if (!_canWrite) {
          loadMsg.textContent = '⚠ 읽기 전용 모드 — Vercel에 GH_TOKEN, GH_REPO 설정 후 새로고침 하세요.';
          loadMsg.className = 'msg err'; return;
        }
        var pname = btn.closest('tr') && btn.closest('tr').querySelector('.pname');
        var nameText = pname ? pname.textContent.trim().slice(0, 30) : '';
        if (!window.confirm('상품 ' + productId + (nameText ? ' (' + nameText + ')' : '') +
            '\n\n복원 처리하시겠습니까?\n다음 크롤링에서 in_stock=true 확인 시 메인 노출됩니다.')) return;

        btn.disabled = true; btn.textContent = '복원 중…';
        try {
          var res = await postJson('/api/revive-product', { productId: productId, adminPin: adminPin });
          if (res.ok && res.data && res.data.success) {
            var sha = res.data.commitSha;
            loadMsg.textContent = '✅ 복원 처리 완료' + (sha ? ' · commit: ' + sha.slice(0, 7) : '');
            loadMsg.className = 'msg ok';
            // soldout_log 최신 상태로 revivedMap 갱신
            if (res.data.log) {
              _revivedMap = {};
              (res.data.log.soldout || []).forEach(function (e) {
                if (e.revived === true) _revivedMap[String(e.id)] = true;
              });
            } else {
              _revivedMap[String(productId)] = true;
            }
            var revivedCount = _soldoutList.filter(function (p) { return _revivedMap[String(p.id)]; }).length;
            var inStock = document.getElementById('stat-active') && parseInt(document.getElementById('stat-active').textContent) || 0;
            updateStats(_soldoutList.length + inStock, inStock, _soldoutList.length, revivedCount);
            renderRows(_soldoutList, _revivedMap, true);
          } else {
            loadMsg.textContent = '복원 실패: ' + ((res.data && res.data.error) || '오류 ' + res.status);
            loadMsg.className = 'msg err';
            btn.disabled = false; btn.textContent = '복원';
          }
        } catch (e) {
          loadMsg.textContent = '요청 실패: ' + (e.message || e);
          loadMsg.className = 'msg err';
          btn.disabled = false; btn.textContent = '복원';
        }
      }

      // ── PIN 인증 ──────────────────────────────────────────────
      async function verifyPin() {
        var pin = String(pinInput.value || '').trim();
        showPinErr('');
        if (!pin) { showPinErr('PIN을 입력하세요.'); return; }
        btnLogin.disabled = true;
        try {
          var res = await postJson('/api/admin-auth', { adminPin: pin });
          if (res.ok && res.data && res.data.ok) {
            adminPin = pin;
            pinPanel.classList.add('hidden');
            dashPanel.classList.remove('hidden');
            await loadLog();
          } else { showPinErr('PIN이 올바르지 않습니다.'); }
        } catch (e) { showPinErr('네트워크 오류: ' + (e.message || e)); }
        finally { btnLogin.disabled = false; }
      }

      function logout() {
        adminPin = ''; pinInput.value = '';
        dashPanel.classList.add('hidden'); pinPanel.classList.remove('hidden');
        showPinErr(''); tbody.innerHTML = ''; loadMsg.textContent = '';
        _soldoutList = []; _revivedMap = {}; _canWrite = false;
        updateStats('—', '—', '—', '—');
      }

      // ── 이벤트 바인딩 ─────────────────────────────────────────
      btnLogin.addEventListener('click', verifyPin);
      pinInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') verifyPin(); });
      btnRefresh.addEventListener('click', loadLog);
      btnLogout.addEventListener('click', logout);
      ['all', 'pending', 'revived'].forEach(function (f) {
        var b = document.getElementById('filter-' + f);
        if (b) b.addEventListener('click', function () { applyFilter(f); });
      });
    })();
  </script>
</body>
</html>
