<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>품절 관리 · 영재컴퓨터</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181c27;
      --border: #2a3142;
      --text: #e8eaef;
      --muted: #8b93a7;
      --accent: #6c9eff;
      --danger: #f87171;
      --ok: #4ade80;
      --purple: #a78bfa;
      --radius: 12px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 10% -10%, #1a2240 0%, transparent 55%), var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
    h1 { font-size: 1.35rem; font-weight: 700; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    input[type="password"] {
      width: 100%;
      max-width: 280px;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0c0e14;
      color: var(--text);
      font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; margin-top: 0.75rem; }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .btn-primary { background: linear-gradient(135deg, #4f74ff, #6c9eff); color: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-revive {
      background: rgba(74, 222, 128, 0.15);
      color: var(--ok);
      border: 1px solid rgba(74, 222, 128, 0.35);
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
    }
    .btn-revive:disabled { opacity: 0.45; cursor: not-allowed; }
    .hidden { display: none !important; }
    .msg { font-size: 0.85rem; margin-top: 0.75rem; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--ok); }
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 640px; }
    th, td {
      padding: 0.65rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { background: #12151f; color: var(--muted); font-weight: 600; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .badge { display: inline-block; padding: 0.15rem 0.45rem; border-radius: 6px; font-size: 0.72rem; font-weight: 600; }
    .badge-revived {
      background: rgba(167, 139, 250, 0.2);
      color: var(--purple);
      border: 1px solid rgba(167, 139, 250, 0.35);
    }
    .badge-soldout {
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .code-cell { display: flex; align-items: center; gap: 0.4rem; }
    .code-badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: 'Consolas', 'Menlo', monospace;
      background: rgba(108, 158, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(108, 158, 255, 0.35);
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .code-none {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .btn-copy {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.72rem;
      padding: 0.2rem 0.45rem;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn-copy:hover { background: rgba(255,255,255,0.12); color: var(--text); }
    .btn-copy.copied { color: var(--ok); border-color: rgba(74,222,128,0.4); }
    .product-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .product-link:hover { text-decoration: underline; }
    .thumb {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #12151f;
      display: block;
      flex-shrink: 0;
    }
    .thumb-broken { opacity: 0.25; }
    .name-cell { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
    .name-text { min-width: 0; }
    .name-text .pname { font-size: 0.82rem; line-height: 1.4; word-break: keep-all; }
    .name-text .stub-note { font-size: 0.72rem; color: var(--danger); margin-top: 0.15rem; }
    .badge-warn {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.35);
    }
    .badge-ok-stock {
      background: rgba(74, 222, 128, 0.1);
      color: var(--ok);
      border: 1px solid rgba(74, 222, 128, 0.25);
    }
    .badge-soldout-stock {
      background: rgba(248, 113, 113, 0.08);
      color: var(--muted);
      border: 1px solid rgba(248, 113, 113, 0.2);
    }
    tr.row-warn td { background: rgba(251, 191, 36, 0.04); }
    tr.row-warn:hover td { background: rgba(251, 191, 36, 0.08); }
    .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
    .filter-btn {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.7rem;
      font-size: 0.8rem;
      background: transparent;
      color: var(--muted);
      font-weight: 500;
    }
    .filter-btn.active { background: rgba(108,158,255,0.15); color: var(--accent); border-color: rgba(108,158,255,0.4); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>품절 · 보류 상품 관리</h1>
    <p class="sub">PIN 인증 후 목록을 확인하고 GitHub에 복원 상태를 반영합니다.</p>

    <section id="pin-panel" class="card">
      <label for="pin-input">관리자 PIN</label>
      <div class="row">
        <input id="pin-input" type="password" autocomplete="current-password" placeholder="PIN 입력" />
        <button type="button" class="btn-primary" id="btn-login">확인</button>
      </div>
      <p id="pin-msg" class="msg err hidden"></p>
    </section>

    <section id="dash-panel" class="hidden">
      <div class="toolbar">
        <span class="sub" style="margin:0" id="dash-welcome">대시보드</span>
        <div>
          <button type="button" class="btn-ghost" id="btn-refresh">새로고침</button>
          <button type="button" class="btn-ghost" id="btn-logout">로그아웃</button>
        </div>
      </div>
      <div class="card">
        <p id="load-msg" class="msg"></p>
        <div class="filter-bar">
          <span style="font-size:0.8rem;color:var(--muted)">필터:</span>
          <button type="button" class="filter-btn active" id="filter-all">전체</button>
          <button type="button" class="filter-btn" id="filter-warn">⚠ 재확인 필요</button>
          <button type="button" class="filter-btn" id="filter-active">보류 중</button>
          <button type="button" class="filter-btn" id="filter-revived">복원됨</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>상품 링크</th>
                <th>상품명 / 썸네일</th>
                <th>상품코드</th>
                <th>가격</th>
                <th>티어</th>
                <th>기록일시</th>
                <th>soldout_log 상태</th>
                <th>현재 재고</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script>
    (function () {
      var adminPin = '';
      var pinInput = document.getElementById('pin-input');
      var btnLogin = document.getElementById('btn-login');
      var pinMsg = document.getElementById('pin-msg');
      var pinPanel = document.getElementById('pin-panel');
      var dashPanel = document.getElementById('dash-panel');
      var tbody = document.getElementById('tbody');
      var loadMsg = document.getElementById('load-msg');
      var btnRefresh = document.getElementById('btn-refresh');
      var btnLogout = document.getElementById('btn-logout');

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/"/g, '&quot;');
      }

      function formatPrice(n) {
        var x = Number(n);
        if (!isFinite(x)) return '-';
        return x.toLocaleString('ko-KR') + '원';
      }

      function showPinErr(t) {
        pinMsg.textContent = t || '';
        pinMsg.classList.toggle('hidden', !t);
        pinMsg.classList.toggle('err', !!t);
      }

      async function postJson(url, body) {
        var r = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body || {}),
        });
        var data = null;
        try { data = await r.json(); } catch (e) { data = null; }
        return { ok: r.ok, status: r.status, data: data };
      }

      async function verifyPin() {
        var pin = String(pinInput.value || '').trim();
        showPinErr('');
        if (!pin) {
          showPinErr('PIN을 입력하세요.');
          return;
        }
        btnLogin.disabled = true;
        try {
          var res = await postJson('/api/admin-auth', { adminPin: pin });
          if (res.ok && res.data && res.data.ok) {
            adminPin = pin;
            pinPanel.classList.add('hidden');
            dashPanel.classList.remove('hidden');
            await loadLog();
          } else {
            showPinErr('PIN이 올바르지 않습니다.');
          }
        } catch (e) {
          showPinErr('네트워크 오류: ' + (e.message || e));
        } finally {
          btnLogin.disabled = false;
        }
      }

      var SHOP_BASE = 'https://www.youngjaecomputer.com/shop';
      var THUMB_BASE = 'https://admin.youngjaecomputer.com/data/item';

      // GY111, VY113, HY263, GY182_W 등 영문2~3자 + 숫자3~4자리 패턴
      var CODE_PATTERN = /\b([A-Z]{2,3}\d{3,4}(?:_[A-Z0-9]+)?)\b/g;
      // 제외할 일반 약어 (CPU 스펙 표기 등)
      var CODE_EXCLUDE = /^(RTX|GTX|RX|CPU|GPU|RAM|SSD|HDD|DDR|USB|LCD|LED|PSU|NVMe|ATX|ITX|OC|TDP|FPS|QHD|FHD|UHD|B2B|RGB|PC|AI|VGA|SIO|DIY)$/i;

      function extractProductCode(name) {
        if (!name) return '';
        var matches = [];
        var m;
        CODE_PATTERN.lastIndex = 0;
        while ((m = CODE_PATTERN.exec(name)) !== null) {
          if (!CODE_EXCLUDE.test(m[1])) {
            matches.push(m[1]);
          }
        }
        return matches.length ? matches[0] : '';
      }

      function productUrl(id) {
        return SHOP_BASE + '/item.php?it_id=' + encodeURIComponent(id);
      }

      function thumbUrl(id) {
        return THUMB_BASE + '/' + encodeURIComponent(id) + '_m';
      }

      function isStubName(name, id) {
        return !name || name === '상품 ' + id || name.trim() === '';
      }

      function copyToClipboard(text, btn) {
        navigator.clipboard.writeText(text).then(function () {
          btn.textContent = '복사됨!';
          btn.classList.add('copied');
          setTimeout(function () {
            btn.textContent = '복사';
            btn.classList.remove('copied');
          }, 1500);
        }).catch(function () {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.textContent = '복사됨!';
          btn.classList.add('copied');
          setTimeout(function () {
            btn.textContent = '복사';
            btn.classList.remove('copied');
          }, 1500);
        });
      }

      var currentFilter = 'all';

      function renderRows(log, pcDataMap) {
        tbody.innerHTML = '';
        var list = (log && log.soldout) || [];
        if (!list.length) {
          loadMsg.textContent = '기록된 품절·보류 상품이 없습니다.';
          loadMsg.className = 'msg';
          return;
        }

        var warnCount = 0;
        list.forEach(function (p) {
          var id = String(p.id != null ? p.id : '');
          var revived = !!p.revived;
          var pcEntry = pcDataMap && pcDataMap[id];
          // 경고 조건: soldout_log에 active(보류)이지만 pc_data에서 in_stock=true
          var pcInStock = pcEntry ? pcEntry.in_stock : null;
          if (!revived && pcInStock === true) warnCount++;
        });

        loadMsg.textContent = '총 ' + list.length + '건' + (warnCount ? ' · ⚠ 재확인 필요 ' + warnCount + '건' : '');
        loadMsg.className = warnCount ? 'msg' : 'msg ok';

        list.forEach(function (p) {
          var tr = document.createElement('tr');
          var id = String(p.id != null ? p.id : '');
          var revived = !!p.revived;
          var purl = productUrl(id);
          var turl = thumbUrl(id);
          var stub = isStubName(p.name, id);
          // pcDataMap은 { id → { in_stock, name } } 형태 (API 응답)
          var pcEntry = pcDataMap && pcDataMap[id];
          var pcEntryName = pcEntry ? (pcEntry.name || '') : '';
          var pcInStockRaw = pcEntry ? pcEntry.in_stock : null;

          // pc_data에서 이름 보강 시도
          var resolvedName = p.name;
          if (stub && pcEntryName && !isStubName(pcEntryName, id)) {
            resolvedName = pcEntryName;
            stub = false;
          }
          var displayName = stub ? '(이름 미수집)' : esc(resolvedName);
          var stubNote = stub ? '<div class="stub-note">⚠ 상품 페이지가 삭제·변경된 것으로 추정</div>' : '';

          // 현재 재고 컬럼
          var pcInStock = pcInStockRaw;
          var stockHtml;
          var isWarn = false;
          if (pcInStock === null || pcInStock === undefined) {
            stockHtml = '<span class="badge" style="background:rgba(139,147,167,0.15);color:var(--muted);border:1px solid var(--border)">확인불가</span>';
          } else if (pcInStock === true) {
            stockHtml = '<span class="badge badge-ok-stock">현재 판매중</span>';
            if (!revived) isWarn = true;
          } else {
            stockHtml = '<span class="badge badge-soldout-stock">현재 품절</span>';
          }

          if (isWarn) tr.classList.add('row-warn');

          // 필터 data 속성
          tr.dataset.filter = revived ? 'revived' : 'active';
          if (isWarn) tr.dataset.warn = '1';

          var statusHtml = revived
            ? '<span class="badge badge-revived">복원됨</span>'
            : (isWarn
                ? '<span class="badge badge-soldout">보류</span> <span class="badge badge-warn" title="pc_data에서 판매중으로 확인됨 — 수동 복원 또는 다음 크롤에서 자동 해소">⚠ 재확인</span>'
                : '<span class="badge badge-soldout">보류</span>');

          var linkCell =
            '<a class="product-link" href="' + esc(purl) + '" target="_blank" rel="noopener">' +
              'it_id: ' + esc(id) +
              '<br><span style="font-size:0.7rem;opacity:0.6">↗ 상품 페이지 열기</span>' +
            '</a>';

          var nameCell =
            '<div class="name-cell">' +
              '<img class="thumb" src="' + esc(turl) + '" alt="" loading="lazy" ' +
                'onerror="this.classList.add(\'thumb-broken\');this.src=\'\';" />' +
              '<div class="name-text">' +
                '<div class="pname">' + displayName + '</div>' +
                stubNote +
              '</div>' +
            '</div>';

          var productCode = extractProductCode(stub ? '' : (p.name || ''));
          var codeCell = productCode
            ? '<div class="code-cell"><span class="code-badge">' + esc(productCode) + '</span><button type="button" class="btn-copy" data-code="' + esc(productCode) + '">복사</button></div>'
            : '<span class="code-none">-</span>';

          tr.innerHTML =
            '<td>' + linkCell + '</td>' +
            '<td>' + nameCell + '</td>' +
            '<td>' + codeCell + '</td>' +
            '<td class="price">' + esc(formatPrice(p.price)) + '</td>' +
            '<td>' + esc(p.tier) + '</td>' +
            '<td>' + esc(p.soldout_at || '') + '</td>' +
            '<td>' + statusHtml + '</td>' +
            '<td>' + stockHtml + '</td>' +
            '<td></td>';

          var copyBtn = tr.querySelector('.btn-copy');
          if (copyBtn) {
            copyBtn.addEventListener('click', function () {
              copyToClipboard(this.dataset.code, this);
            });
          }
          var tdBtn = tr.querySelector('td:last-child');
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-revive';
          btn.textContent = '복원';
          btn.disabled = revived;
          btn.dataset.id = id;
          btn.addEventListener('click', function () { reviveProduct(id, btn); });
          tdBtn.appendChild(btn);
          tbody.appendChild(tr);
        });

        applyFilter(currentFilter);
      }

      function applyFilter(f) {
        currentFilter = f;
        document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
        var activeBtn = document.getElementById('filter-' + f);
        if (activeBtn) activeBtn.classList.add('active');

        var rows = tbody.querySelectorAll('tr');
        rows.forEach(function (tr) {
          var show = true;
          if (f === 'warn') show = tr.dataset.warn === '1';
          else if (f === 'active') show = tr.dataset.filter === 'active';
          else if (f === 'revived') show = tr.dataset.filter === 'revived';
          tr.style.display = show ? '' : 'none';
        });
      }

      // GitHub 최신 데이터를 직접 읽는 API 호출 (Vercel 정적 파일 우회)
      async function loadLog() {
        loadMsg.textContent = '불러오는 중…';
        loadMsg.className = 'msg';
        btnRefresh.disabled = true;
        btnRefresh.textContent = '새로고침 중…';
        try {
          var res = await postJson('/api/admin-soldout-log', { adminPin: adminPin });
          if (!res.ok || !res.data || !res.data.log) {
            var errMsg = (res.data && res.data.error) || ('오류 ' + res.status);
            loadMsg.textContent = 'GitHub 최신 로그를 불러오지 못했습니다: ' + errMsg;
            loadMsg.className = 'msg err';
            return;
          }
          var log = res.data.log;
          var pcDataMap = res.data.pcMap || {};  // id → { in_stock, name }
          _lastLog = log;
          _lastPcMap = pcDataMap;
          var now = new Date().toLocaleString('ko-KR');
          document.getElementById('dash-welcome').textContent = '마지막 갱신: ' + now;
          renderRows(log, pcDataMap);
        } catch (e) {
          loadMsg.textContent = '불러오기 실패: ' + (e.message || e);
          loadMsg.className = 'msg err';
        } finally {
          btnRefresh.disabled = false;
          btnRefresh.textContent = '새로고침';
        }
      }

      // 복원 직전 스냅샷 (re-render용)
      var _lastLog = null;
      var _lastPcMap = null;

      async function reviveProduct(productId, btn) {
        if (!adminPin || !productId) return;

        // 실수 방지 확인 모달
        var productName = btn.closest('tr') &&
          btn.closest('tr').querySelector('.pname') &&
          btn.closest('tr').querySelector('.pname').textContent;
        var confirmMsg = '상품 ' + productId +
          (productName ? ' (' + productName.trim().slice(0, 30) + ')' : '') +
          '\n\n복원(판매중) 처리하시겠습니까?\nGitHub soldout_log.json에 즉시 반영됩니다.';
        if (!window.confirm(confirmMsg)) return;

        btn.disabled = true;
        btn.textContent = '복원 중…';
        try {
          var res = await postJson('/api/revive-product', {
            productId: productId,
            adminPin: adminPin,
          });
          if (res.ok && res.data && res.data.success) {
            // API 응답에 포함된 최신 로그로 즉시 re-render (정적 파일 재조회 없음)
            var sha = res.data.commitSha;
            var shaLabel = sha ? ' · commit: ' + sha.slice(0, 7) : '';
            loadMsg.textContent = '✅ 복원 완료' + shaLabel;
            loadMsg.className = 'msg ok';
            if (res.data.log) {
              _lastLog = res.data.log;
              renderRows(_lastLog, _lastPcMap || {});
            } else {
              await loadLog();
            }
          } else {
            var err = (res.data && res.data.error) || ('오류 ' + res.status);
            loadMsg.textContent = '복원 실패: ' + err;
            loadMsg.className = 'msg err';
            btn.disabled = false;
            btn.textContent = '복원';
          }
        } catch (e) {
          loadMsg.textContent = '요청 실패: ' + (e.message || e);
          loadMsg.className = 'msg err';
          btn.disabled = false;
          btn.textContent = '복원';
        }
      }

      function logout() {
        adminPin = '';
        pinInput.value = '';
        dashPanel.classList.add('hidden');
        pinPanel.classList.remove('hidden');
        showPinErr('');
        tbody.innerHTML = '';
        loadMsg.textContent = '';
      }

      btnLogin.addEventListener('click', verifyPin);
      pinInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') verifyPin();
      });
      btnRefresh.addEventListener('click', loadLog);
      btnLogout.addEventListener('click', logout);

      ['all', 'warn', 'active', 'revived'].forEach(function (f) {
        var b = document.getElementById('filter-' + f);
        if (b) b.addEventListener('click', function () { applyFilter(f); });
      });
    })();
  </script>
</body>
</html>
